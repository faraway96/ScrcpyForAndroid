name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/build-cache-*
          key: gradle-builds-${{ github.sha }}
          restore-keys: gradle-builds-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # legacy API 23 port: miuix 子模块声明 MIN_SDK=24, 降到 23
      - name: Patch miuix submodule minSdk 24 -> 23
        run: |
          set -euo pipefail
          sed -i 's/const val MIN_SDK = 24/const val MIN_SDK = 23/' \
            submodule/miuix/build-plugins/src/main/kotlin/BuildConfig.kt
          grep -n "MIN_SDK" submodule/miuix/build-plugins/src/main/kotlin/BuildConfig.kt

      - name: Build debug APKs
        run: ./gradlew clean assembleDebug

      - name: Collect APKs
        run: |
          set -euxo pipefail
          mkdir -p out
          find app/build/outputs/apk -type f -name "*.apk" | sort > out/apk-list.txt
          cat out/apk-list.txt
          if [ ! -s out/apk-list.txt ]; then
            echo "No APK files were generated"
            exit 1
          fi
          while IFS= read -r apk; do
            base_name="$(basename "$apk")"
            cp "$apk" "out/${base_name}"
          done < out/apk-list.txt
          rm -f out/apk-list.txt
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pr-apks-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
